name: Make image thumbnails
on:
  workflow_dispatch:
  push:
    paths:
      - 'images/**'
      - '!images/thumbs/**'
      - '!images/med/**'
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y webp imagemagick
      - name: Generate thumbnails (480px) and medium (1280px)
        run: |
          shopt -s nullglob
          for f in images/*/*.webp; do
            d=$(dirname "$f" | sed 's#^images/##'); n=$(basename "$f")
            case "$d" in thumbs|med|thumbs/*|med/*) continue;; esac
            mkdir -p "images/thumbs/$d" "images/med/$d"
            [ -f "images/thumbs/$d/$n" ] || convert "$f" -resize '480x480>' -quality 68 "images/thumbs/$d/$n"
            [ -f "images/med/$d/$n" ] || convert "$f" -resize '1280x1280>' -quality 78 "images/med/$d/$n"
          done
      - name: Commit results
        run: |
          git config user.name "thumbs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add images/thumbs images/med
          if ! git diff --cached --quiet; then git commit -m "Add image thumbnails"; git push; fi
