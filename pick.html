<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>اختيار الصور</title><style>body{font-family:Tahoma,sans-serif;margin:0;padding:12px;background:#0d1654;color:#fff}h2{margin:20px 0 8px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}figure{margin:0;background:#fff;color:#000;border-radius:10px;overflow:hidden;text-align:center;cursor:pointer}img{width:100%;aspect-ratio:1;object-fit:contain;background:#eee;display:block}b{display:block;padding:4px;font-size:13px}#t{position:fixed;inset:auto 12px 12px;background:#ee7d3b;padding:10px;border-radius:12px;text-align:center;display:none}</style></head><body><h1>اختر الصورة المناسبة</h1><p>اضغط على أي صورة ليظهر رقمها في الأسفل. أرسل لي الرقم الذي تريده.</p><div id="t"></div><script>const R=s=>s.split(",").flatMap(x=>{const[a,b]=x.split("-").map(Number);return b?Array.from({length:b-a+1},(_,i)=>a+i):[a]});
const G=[["alqasr-tuna","تونة القصر","79,86,98,110,112,118,121-122,127-129,137-138,146,149,159,164"],["alshihr-tuna","تونة بحر الشحر","111,113,115-117,120,123-126,130-131,134-135,139,141-145,147-148,150,152-154,156-158"],["wesal-tuna","تونة وصال","9-22,24-41,43-75,77-78,81-83,85,88,90-92,94-95,97,99-104,107,109,114,119,140"],["wesal-tea","شاي وصال","76,87,89,93,96,106,108,132-133,136,151,155,160-163"]];
document.body.insertAdjacentHTML("beforeend",G.map(([d,n,l])=>`<h2>${n}</h2><div class="g">${R(l).map(x=>{const u=`images/${d}/falhoom-sons-trading-company${x}.webp`;return`<figure data-k="${d}/${x}"><img loading="lazy" src="${u.replace("images/","images/thumbs/")}" onerror="this.onerror=null;this.src='${u}'"><b>${x}</b></figure>`}).join("")}</div>`).join(""));
document.addEventListener("click",e=>{const f=e.target.closest("figure");if(f){const t=document.getElementById("t");t.style.display="block";t.textContent="الصورة المختارة: "+f.dataset.k}})</script></body></html>
